name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.3 }
      - run: bun install --frozen-lockfile
      - run: bun run build:tokens
      - run: bun run typecheck
      - run: bun run test
      - run: bun run sizes
      # Anima is private, so CI has no .anima/: the e2e suite runs the plain-Onyx paths and skips
      # tests that need the runtime (see docs/design.md §8).
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test --project chromium
        env: { GOLEM_E2E_WORKERS: "2" }
