name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    # A v* tag runs the same checks, then attaches the tarball to a GitHub release (nothing goes to npm).
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned Anima commit
        id: anima
        run: echo "commit=$(jq -r .commit anima-pin.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: MRoiban/anima
          ref: ${{ steps.anima.outputs.commit }}
          path: anima
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.3 }
      # Onyx comes from a GitHub release tarball: cache it (see scripts/ci-install.sh for the fallback).
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: bun install (with an API fallback for the Onyx release tarball)
        run: scripts/ci-install.sh
        env: { GH_TOKEN: "${{ github.token }}" }
      - name: Install Anima's build tools
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: anima
      - run: bun run build:tokens
      - run: bun run build:anima
        env: { ANIMA_DIR: "${{ github.workspace }}/anima" }
      - run: bun run typecheck
      - run: bun run test
      - run: bun run sizes
      - run: bun run pack
      - run: bun run smoke
      - run: bunx playwright install --with-deps chromium firefox
      - run: bunx playwright test
        env: { GOLEM_E2E_WORKERS: "2" }
      - name: Release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env: { GH_TOKEN: "${{ github.token }}", TAG: "${{ github.ref_name }}" }
        run: |
          version=$(jq -r .version packages/golem/package.json)
          [ "$TAG" = "v$version" ] || { echo "tag $TAG does not match packages/golem version $version"; exit 1; }
          gh release create "$TAG" release/*.tgz --title "$TAG" \
            --notes "@mroiban/golem $version, with the Anima runtime built from $(jq -r .commit anima-pin.json)."
